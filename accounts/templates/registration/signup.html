{% extends "base.html" %}

{% block title %}Sign up | Learning Tracker{% endblock %}

{% block content %}
    <div class="card form-card auth-card">
        <h1>Create an account</h1>
        <p class="muted">Track what you're learning, one topic at a time.</p>

        <form method="post">
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            <button type="submit" class="btn btn-primary btn-block">Sign up</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </div>
{% endblock %}
